name: Web App (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ai/**'
      - 'retrieval/**'
      - 'etl/**'
      - 'data/**'
      - 'sources/**'
      - 'books/ni-haixia-medicine/*.pdf'
      - 'web/**'
      - 'scripts/build_pages.py'
      - 'scripts/pages/**'
      - 'scripts/validate_curated_batches.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/web-app.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx
      - name: Run validators and unit tests
        run: |
          python -m etl.acupuncture.validate
          python -m etl.bencao.validate
          python -m etl.neijing.validate
          python -m etl.library.validate
          python scripts/validate_curated_batches.py
          python -m unittest discover -s tests -q
      - name: Build static web / PWA bundle
        run: python scripts/build_pages.py
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
